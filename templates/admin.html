{% extends "base.html" %}{% block c %}
<h2 class="text-2xl font-bold glow mt-4">Payment approvals</h2>
<div class="grid md:grid-cols-2 gap-4 mt-4">{% for p in ps %}<div class="g p-4"><b>{{p.name}}</b> · {{p.email}} · {{p.phone}}<div class="text-sm text-slate-400">{{p.created}} · <span class="text-cyan-300">{{p.status}}</span></div>
<a href="{{ url_for('shot',pid=p.id) }}" target="_blank"><img src="{{ url_for('shot',pid=p.id) }}" class="my-2 max-h-64 rounded"></a>
{% if p.status=='pending' %}<div class="flex gap-2"><form method="post" action="{{ url_for('admin_act',pid=p.id,act='approve') }}"><button class="btn">Approve</button></form><form method="post" action="{{ url_for('admin_act',pid=p.id,act='reject') }}"><button class="g px-4 py-2">Reject</button></form></div>{% endif %}</div>
{% else %}<p class="text-slate-400">No payments yet.</p>{% endfor %}</div>{% endblock %}
