<div id="gpbot" class="nodl" style="position:fixed;right:14px;bottom:14px;z-index:60;font-family:inherit">
<button id="gpb-open" type="button" aria-label="Open GrowthPulse assistant" style="width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;font-size:26px;color:#fff;background:linear-gradient(90deg,#2563eb,#06b6d4);box-shadow:0 0 22px rgba(34,211,238,.7)">🤖</button>
<div id="gpb-box" style="display:none;position:absolute;right:0;bottom:68px;width:min(360px,calc(100vw - 28px));height:min(480px,70vh);flex-direction:column;background:rgba(10,23,64,.97);border:1px solid rgba(96,165,250,.4);border-radius:1rem;box-shadow:0 8px 40px rgba(0,0,0,.6);overflow:hidden">
<div style="display:flex;justify-content:space-between;align-items:center;padding:.7rem .9rem;background:rgba(30,58,138,.6);color:#e2e8f0;font-weight:700"><span>🤖 GrowthPulse Assistant</span><button id="gpb-x" type="button" aria-label="Close" style="background:none;border:0;color:#e2e8f0;font-size:20px;cursor:pointer">✕</button></div>
<div id="gpb-log" style="flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.5rem;font-size:.92rem;color:#e2e8f0"></div>
<div id="gpb-chips" style="display:flex;gap:.4rem;flex-wrap:wrap;padding:0 .8rem .5rem"></div>
<div style="display:flex;gap:.4rem;padding:.6rem;border-top:1px solid rgba(96,165,250,.25)"><input id="gpb-in" class="in" style="font-size:16px;padding:.5rem .7rem" placeholder="Ask anything about this page…" maxlength="500" autocomplete="off"><button id="gpb-send" type="button" class="btn" style="padding:.4rem .9rem;min-height:40px">Send</button></div>
</div></div>
<script>
(function(){
var box=document.getElementById('gpb-box'),log=document.getElementById('gpb-log'),inp=document.getElementById('gpb-in'),send=document.getElementById('gpb-send'),chips=document.getElementById('gpb-chips'),busy=false,hist=[];
function add(t,me){var d=document.createElement('div');d.style.cssText='max-width:88%;padding:.5rem .75rem;border-radius:.8rem;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;'+(me?'align-self:flex-end;background:#2563eb;color:#fff':'align-self:flex-start;background:rgba(30,58,138,.55)');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function pageText(){var m=document.querySelector('main');return (m?m.innerText:document.body.innerText).replace(/\s+/g,' ').slice(0,1200)}
async function ask(q){q=(q||inp.value).trim();if(!q||busy)return;inp.value='';chips.style.display='none';add(q,true);if(window.GPSound)GPSound.play('send');busy=true;send.disabled=true;var w=add('Thinking…',false);
try{var r=await fetch('{{ url_for("bot") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q,title:document.title,path:location.pathname,page:pageText(),hist:hist.slice(-6)})});
var j=await r.json();w.textContent=j.answer||'Sorry, I could not answer that. Please try again.';hist.push({r:'user',m:q},{r:'bot',m:w.textContent});if(window.GPSound){GPSound.play('recv');var lb=document.createElement('button');lb.type='button';lb.className='gp-listen';lb.textContent='🔊 Listen';lb.dataset.sp='0';lb.style.cssText='display:block;margin-top:.4rem;font-size:.72rem;padding:.2rem .55rem;border-radius:999px;border:1px solid #22d3ee;background:none;color:#67e8f9;cursor:pointer';var txt=w.textContent;lb.onclick=function(){GPSound.speak(txt,lb)};w.appendChild(lb)}}
catch(e){w.textContent='⚠️ Could not reach the assistant. Please check your internet and try again.'}
busy=false;send.disabled=false;log.scrollTop=log.scrollHeight}
function openB(){box.style.display='flex';if(!log.children.length){add('Hi! 👋 I can explain what is on this page, help you study, or show you how to use GrowthPulse.',false);
['What can I do on this page?','Explain this simply','How do I use GrowthPulse?'].forEach(function(t){var b=document.createElement('button');b.type='button';b.textContent=t;b.style.cssText='font-size:.78rem;padding:.3rem .65rem;border-radius:999px;border:1px solid #22d3ee;background:none;color:#67e8f9;cursor:pointer';b.onclick=function(){ask(t)};chips.appendChild(b)})}inp.focus()}
document.getElementById('gpb-open').onclick=function(){box.style.display==='flex'?box.style.display='none':openB()};
document.getElementById('gpb-x').onclick=function(){box.style.display='none'};
send.onclick=function(){ask()};inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();ask()}});
})();
</script>
