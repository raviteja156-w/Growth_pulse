services:
  - type: web
    name: growthpulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 240 --workers 2 --threads 4
    envVars:
      - {key: PYTHON_VERSION, value: 3.11.9}
      - {key: SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, sync: false}
      - {key: ADMIN_USER, sync: false}
      - {key: ADMIN_PASS, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: AI_MODEL, value: openai/gpt-oss-120b}
